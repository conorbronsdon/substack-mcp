name: Container

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    # Same runner as the Publish container job, so this check sees the release daemon.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check container transport controls
        run: node --test scripts/container-readiness.controls.mjs
      - name: Build versioned image
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REVISION=$(git rev-parse HEAD)
          driver="$(docker info --format '{{.Driver}}')"
          if [ "$driver" != overlay2 ]; then
            echo "::error::Docker image store driver is '$driver'; publish-container.mjs requires the classic overlay2 store."
            exit 1
          fi
          docker build --provenance=false --sbom=false --build-arg VERSION="$VERSION" --build-arg REVISION="$REVISION" -t substack-mcp:check .
      - name: Verify image ownership and both transports
        run: node scripts/test-container.mjs substack-mcp:check "$(git rev-parse HEAD)"
      - name: Reject an image with the wrong source identity
        run: |
          if node scripts/test-container.mjs substack-mcp:check 0000000000000000000000000000000000000000; then
            echo "Identity control incorrectly accepted a mismatched source revision"
            exit 1
          fi
      - name: Exercise the release publisher against a loopback registry
        # Same publisher, same daemon, plain-HTTP registry on loopback; nothing reaches GHCR.
        run: |
          docker info --format 'image store: {{.Driver}} {{json .DriverStatus}}'
          docker run -d --name release-registry -p 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/v2/ >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::The loopback registry did not answer on 127.0.0.1:5000 within 30 seconds."
            exit 1
          fi
          node scripts/publish-container.local-registry.mjs substack-mcp:check "$(git rev-parse HEAD)" 127.0.0.1:5000
