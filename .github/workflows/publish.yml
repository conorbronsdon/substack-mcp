name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'conorbronsdon/substack-mcp'
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MANIFEST: ${{ runner.temp }}/release-server.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 bundles npm >= 11.5.1 (required for trusted publishing) with
          # sigstore intact. Self-upgrading npm on the Node 22 runner
          # (npm install -g npm@latest) left provenance's `sigstore` dependency
          # unresolvable — "Cannot find module 'sigstore'" — so we take a base
          # image that already has a modern npm instead of upgrading in place.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Release commits must carry aligned package, lockfile, and registry
      # metadata. `npm version` synchronizes and stages server.json before the
      # release commit is created.
      - name: Verify release metadata
        run: npm run check:release

      - name: Install dependencies
        run: npm ci

      - name: Check release ordering controls
        run: npm run test:release

      - name: Inspect all release destinations before publication
        id: plan
        run: node scripts/release-state.mjs plan

      - name: Build and test new npm release
        if: steps.plan.outputs.npm == 'true'
        run: |
          npm run build
          npm test

      - name: Publish to npm
        if: steps.plan.outputs.npm == 'true'
        run: npm publish --provenance --access public

      - name: Verify npm and refresh recovery plan
        id: artifacts
        env:
          RELEASE_TARGET: ${{ steps.plan.outputs.target }}
        run: node scripts/release-state.mjs verify-npm

      - name: Publish to the MCP registry
        if: steps.artifacts.outputs.registry == 'true'
        # Pinned publisher and checksum; use the original release manifest.
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish "$RELEASE_MANIFEST"

      - name: Verify Registry and refresh GitHub recovery plan
        id: registry
        env:
          RELEASE_TARGET: ${{ steps.plan.outputs.target }}
        run: node scripts/release-state.mjs verify-registry

      - name: Create missing GitHub release independently
        if: steps.registry.outputs.github == 'true'
        env:
          VERSION: ${{ steps.registry.outputs.version }}
          RELEASE_TARGET: ${{ steps.registry.outputs.target }}
        run: gh release create "v$VERSION" --target "$RELEASE_TARGET" --generate-notes

      - name: Verify all published identities
        env:
          RELEASE_TARGET: ${{ steps.plan.outputs.target }}
        run: node scripts/release-state.mjs verify
