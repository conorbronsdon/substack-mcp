name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      reconciled_commit:
        description: 'Only for missing npm gitHead: independently verified original commit SHA'
        required: false
        type: string
      reconciled_integrity:
        description: 'Only for missing npm gitHead: independently verified exact npm sha512 integrity'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'conorbronsdon/substack-mcp'
    timeout-minutes: 20
    outputs:
      version: ${{ steps.registry.outputs.version }}
      target: ${{ steps.registry.outputs.target }}
      container: ${{ steps.container.outputs.enabled }}
    env:
      GH_TOKEN: ${{ github.token }}
      RECONCILED_RELEASE_COMMIT: ${{ inputs.reconciled_commit }}
      RECONCILED_NPM_INTEGRITY: ${{ inputs.reconciled_integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 bundles npm >= 11.5.1 (required for trusted publishing) with
          # sigstore intact. Self-upgrading npm on the Node 22 runner
          # (npm install -g npm@latest) left provenance's `sigstore` dependency
          # unresolvable — "Cannot find module 'sigstore'" — so we take a base
          # image that already has a modern npm instead of upgrading in place.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Release commits must carry aligned package, lockfile, and registry
      # metadata. `npm version` synchronizes and stages server.json before the
      # release commit is created.
      - name: Verify release metadata
        run: npm run check:release

      - name: Install dependencies
        run: npm ci

      - name: Check release ordering controls
        run: npm run test:release

      - name: Set release manifest path
        run: echo "RELEASE_MANIFEST=$RUNNER_TEMP/release-server.json" >> "$GITHUB_ENV"

      - name: Inspect all release destinations before publication
        id: plan
        run: node scripts/release-state.mjs plan

      - name: Build and test new npm release
        if: steps.plan.outputs.npm == 'true'
        run: |
          npm run build
          npm test

      - name: Publish to npm
        if: steps.plan.outputs.npm == 'true'
        run: npm publish --provenance --access public

      - name: Verify npm and refresh recovery plan
        id: artifacts
        env:
          RELEASE_TARGET: ${{ steps.plan.outputs.target }}
        run: node scripts/release-state.mjs verify-npm

      - name: Publish to the MCP registry
        if: steps.artifacts.outputs.registry == 'true'
        # Pinned publisher and checksum; use the original release manifest.
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish "$RELEASE_MANIFEST"

      - name: Verify Registry and refresh GitHub recovery plan
        id: registry
        env:
          RELEASE_TARGET: ${{ steps.plan.outputs.target }}
        run: node scripts/release-state.mjs verify-registry

      - name: Create missing GitHub release independently
        if: steps.registry.outputs.github == 'true'
        env:
          VERSION: ${{ steps.registry.outputs.version }}
          RELEASE_TARGET: ${{ steps.registry.outputs.target }}
        run: gh release create "v$VERSION" --target "$RELEASE_TARGET" --generate-notes

      - name: Verify all published identities
        env:
          RELEASE_TARGET: ${{ steps.plan.outputs.target }}
        run: node scripts/release-state.mjs verify

      - name: Determine original release container support
        id: container
        env:
          RELEASE_TARGET: ${{ steps.registry.outputs.target }}
        run: |
          if git cat-file -e "$RELEASE_TARGET:scripts/test-container.mjs"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  container:
    needs: publish
    if: needs.publish.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      RELEASE_TARGET: ${{ needs.publish.outputs.target }}
      IMAGE: ghcr.io/conorbronsdon/substack-mcp
      DOCKER_CONFIG: ${{ runner.temp }}/release-docker-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.target }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify original source and build
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          npm ci --ignore-scripts
          docker build --build-arg VERSION="$VERSION" --build-arg REVISION="$RELEASE_TARGET" -t "$IMAGE:build" .
          node scripts/test-container.mjs "$IMAGE:build" "$RELEASE_TARGET"
      - name: Authenticate only after image verification
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_ACTOR" --password-stdin
      - name: Publish and verify versioned image
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-container.mjs
      - name: Remove runner registry authentication
        if: always()
        run: docker logout ghcr.io
