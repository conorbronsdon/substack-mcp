name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1 (required for trusted publishing) with
          # sigstore intact. Self-upgrading npm on the Node 22 runner
          # (npm install -g npm@latest) left provenance's `sigstore` dependency
          # unresolvable — "Cannot find module 'sigstore'" — so we take a base
          # image that already has a modern npm instead of upgrading in place.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Release commits must carry aligned package, lockfile, and registry
      # metadata. `npm version` synchronizes and stages server.json before the
      # release commit is created.
      - name: Verify release metadata
        run: npm run check:release

      - name: Install dependencies
        run: npm ci

      - name: Check if package.json version is already published
        id: version
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          PUBLISHED_VERSION="$(npm view "$PKG_NAME" version 2>/dev/null || echo none)"
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          RELEASE_STATE="$(node scripts/check-release-order.mjs "$LOCAL_VERSION" "$PUBLISHED_VERSION")"
          if [ "$RELEASE_STATE" = "same" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json version ($LOCAL_VERSION) is already published — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "package.json version ($LOCAL_VERSION) differs from published ($PUBLISHED_VERSION) — publishing."
          fi

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: npm test --if-present

      - name: Show tool versions
        if: steps.version.outputs.changed == 'true'
        run: node --version && npm --version

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public

      # Checked independently of the npm gate above: npm and the registry can be
      # out of sync on their own, so a workflow_dispatch has to be able to push a
      # registry-only catch-up without an npm version bump.
      - name: Check if version is already in the MCP registry
        id: registry
        run: |
          SERVER_NAME="$(node -p "require('./package.json').mcpName")"
          LOCAL_VERSION="${{ steps.version.outputs.local }}"
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=$SERVER_NAME" -o registry.json; then
            REGISTRY_VERSION="$(SERVER_NAME="$SERVER_NAME" node -p "const r = JSON.parse(require('fs').readFileSync('registry.json', 'utf8')).servers || []; const exact = r.filter(s => s.server && s.server.name === process.env.SERVER_NAME); const key = 'io.modelcontextprotocol.registry/official'; const latest = exact.find(s => s._meta && s._meta[key] && s._meta[key].isLatest) || exact.sort((a, b) => ((b._meta && b._meta[key] && b._meta[key].publishedAt) || '').localeCompare((a._meta && a._meta[key] && a._meta[key].publishedAt) || ''))[0]; latest ? latest.server.version : 'none'")"
          else
            REGISTRY_VERSION=unknown
            echo "Registry lookup failed — will attempt the publish and let it decide."
          fi
          rm -f registry.json
          if [ "$LOCAL_VERSION" = "$REGISTRY_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "MCP registry already has $SERVER_NAME@$LOCAL_VERSION — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "MCP registry has $REGISTRY_VERSION, package.json is $LOCAL_VERSION — publishing."
          fi

      - name: Publish to the MCP registry
        if: steps.registry.outputs.changed == 'true'
        # Pinned: an unpinned /latest/ URL silently changes the CLI under CI.
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.local }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
          fi
